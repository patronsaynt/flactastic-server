name: Release

on:
  push:
    tags: ["beta-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. beta-2
        required: true

permissions: {}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            go_sha256: 65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40
          - runner: ubuntu-24.04-arm
            arch: arm64
            go_sha256: a06e99309dbcbdca1a8ccd2282c3ee146e55930886e26b4f1193269587165f49
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    permissions:
      contents: read
    env:
      GO_VERSION: 1.27.3
      ARCH: ${{ matrix.arch }}
      GO_SHA256: ${{ matrix.go_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake curl ca-certificates zlib1g-dev
          curl -fsSLo /tmp/go.tgz "https://go.dev/dl/go$GO_VERSION.linux-$ARCH.tar.gz"
          echo "$GO_SHA256  /tmp/go.tgz" | sha256sum -c -
          tar -C /usr/local -xzf /tmp/go.tgz
          echo /usr/local/go/bin >> "$GITHUB_PATH"

      - run: scripts/build-taglib.sh
      - run: go test ./...
      - run: CGO_ENABLED=1 go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "flactastic-server-linux-$ARCH" .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flactastic-server-linux-${{ matrix.arch }}
          path: flactastic-server-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flactastic-server-linux-*
          path: release
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh dist/flactastic-server.service dist/flactastic-server.avahi.service release/
          cd release
          sha256sum -- * > SHA256SUMS
          # A release made by hand for this tag gets the files added to it.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --prerelease --generate-notes
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- *
